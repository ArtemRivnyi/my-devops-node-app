<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Связаться</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <nav>
    <a href="/">Главная</a>
    <a href="/about">О сайте</a>
    <a href="/contact">Связаться</a>
  </nav>
  <main>
    <h1>Связаться с нами</h1>
    <p>Оставьте свое сообщение ниже, и мы постараемся ответить вам как можно скорее.</p>
    <form action="/submit-contact" method="POST">
      <label for="name">Ваше имя:</label>
      <input type="text" id="name" name="name" required placeholder="Введите ваше имя"><br>
      
      <label for="email">Ваш Email:</label>
      <input type="email" id="email" name="email" required placeholder="email@example.com"><br>
      
      <label for="message">Сообщение:</label>
      <textarea id="message" name="message" rows="7" required placeholder="Ваше сообщение..."></textarea><br>
      
      <button type="submit">Отправить сообщение</button>
    </form>
  </main>
  <canvas id="matrix-canvas" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; background-color: #050505;"></canvas>
  <script>
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let columns;
    const charSize = 14;
    let drops = [];
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      columns = Math.floor(width / charSize);
      drops = [];
      for (let i = 0; i < columns; i++) {
        drops[i] = Math.random() * -100;
      }
    }
    function draw() {
      ctx.fillStyle = 'rgba(5, 5, 5, 0.1)';
      ctx.fillRect(0, 0, width, height);
      ctx.fillStyle = 'rgba(102, 126, 234, 0.25)'; 
      ctx.font = charSize + 'px monospace';
      for (let i = 0; i < drops.length; i++) {
        const text = String.fromCharCode(Math.random() * 128);
        const x = i * charSize;
        const y = drops[i] * charSize;
        ctx.fillText(text, x, y);
        if (y > height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }
    window.addEventListener('resize', resize);
    resize();
    setInterval(draw, 33);
  </script>
</body>
</html>
